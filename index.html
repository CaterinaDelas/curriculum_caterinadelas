<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Caterina Delas - Portfolio</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/png" href="img/svg/ojo_abierto.svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    </style>
</head>

<body>

    <header class="header-container">

        <div class="header-azul">

            <!-- logo / nombre -->
            <div class="logo-y-nombre">
                <div class="contenedor-ojito">
                    <img src="img/svg/ojo_abierto.svg" alt="Logo ojo abierto" class="ojo-abierto">
                    <img src="img/svg/ojo_cerrado.svg" alt="Logo ojo cerrado" class="ojo-cerrado">
                </div>
                <p class="header-nombre"> / CATERINA DELÁS. </p>
            </div>

            <!-- nav -->
            <nav>
                <a href="contacto.html" class="botones-nav">Contacto</a>
            </nav>

        </div>

    </header>

    <main>

        <section class="portada">
            <div class="portada-nombre-y-bajada">
                <h1> Caterina Delás </h1>
                <h4>DISEÑO GRÁFICO / ILUSTRACIÓN</h4>
            </div>

            <img src="img/svg/flecha.svg" alt="flecha hacia abajo" width="68" height="72">
        </section>

        <section class="contenidos">
            <div class="contenidos-botones-todos">

                <!-- botones -->
                <a href="proyectos.html">
                    / PROYECTOS.
                    <img src="img/svg/asterisco.svg" alt="Asterisco" class="asterisco-hover">
                </a>
                <a href="contacto.html">
                    / CONTACTO.
                    <img src="img/svg/asterisco.svg" alt="Asterisco" class="asterisco-hover">
                </a>

                <!-- desplegable-->
                <button class="desplegable" type="button">
                    <p>/ SOBRE MÍ</p>
                    <p class="texto-desplegado">
                        Diseñadora e ilustradora orientada a la creación de identidad visual, proyectos editoriales y
                        comunicación de marca.
                        Fusionando la exploración analógica (mucha) con herramientas digitales, abarcando principalmente
                        la ilustración, diseño editorial, bajadas a piezas reales como afiches, merch y publicaciones
                        varias para redes sociales.
                        PD. Me gusta dibujar perritos, es inevitable.
                    </p>
                    <img src="img/svg/asterisco.svg" alt="Asterisco" class="asterisco-hover">
                </button>

            </div>

        </section>

    </main>

    <footer>
        <p>Copyright 2026 © / Caterina Delás</p>
        <nav class="footer-nav">
            <a href="https://www.behance.net/whoskt" target="_blank" class="botones-nav">/ Behance.</a>
            <a href="https://www.instagram.com/whoskt/?hl=es" target="_blank" class="botones-nav">/ Instagram.</a>
            <a href="https://www.linkedin.com/in/caterina." target="_blank" class="botones-nav">/ Linkedin.</a>
        </nav>
    </footer>

</html>
